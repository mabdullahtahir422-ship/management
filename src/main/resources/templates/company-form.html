<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Company</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 30px;
            font-size: 32px;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            padding-bottom: 40px;
        }

        .card {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            border: 2px solid rgba(0,255,255,0.4);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e0fbfc;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #e0fbfc;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            border: 2px solid cyan;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, cyan, #00bcd4);
            color: #0b132b;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px cyan;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: cyan;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="header">
    Add Company
</div>

<div class="container">
    <div class="card">

        <h2>Add Company</h2>

        <form th:action="@{/companies/save}" th:object="${company}" method="post">

            <div class="form-group">
                <label>User ID:</label>
                <input type="number" th:field="*{userId}" placeholder="Enter User ID" required/>
            </div>

            <div class="form-group">
                <label>Company Name:</label>
                <input type="text" th:field="*{companyName}" placeholder="Enter Company Name" required/>
            </div>

            <div class="form-group">
                <label>Owner Name:</label>
                <input type="text" th:field="*{ownerName}" placeholder="Enter Owner Name" required/>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" placeholder="Enter Email"/>
            </div>

            <div class="form-group">
                <label>Phone:</label>
                <input type="text" th:field="*{phone}" placeholder="Enter Phone"/>
            </div>

            <button type="submit" class="btn">Save Company</button>

        </form>

        <a th:href="@{/companies}" class="back">⬅ Back to Company List</a>

    </div>
</div>

</body>
</html>
