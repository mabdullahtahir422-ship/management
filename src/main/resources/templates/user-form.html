<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add User</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    h2 {
      margin-top: 40px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #e0fbfc;
      text-align: center;
    }

    .form-container {
      background-color: rgba(18, 30, 49, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 30px 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-top: 25px;
      backdrop-filter: blur(8px);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #8d99ae;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      background-color: #1b263b;
      border: 1px solid #415a77;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s ease;
    }

    input:focus {
      border-color: #00d2d3;
    }

    button[type="submit"] {
      width: 100%;
      background: #00d2d3;
      color: #0b132b;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(0, 210, 211, 0.3);
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background: #00b4d8;
      box-shadow: 0 6px 16px rgba(0, 210, 211, 0.5);
      transform: translateY(-1px);
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      background: #00d2d3;
      color: #0b132b;
      padding: 10px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(0, 210, 211, 0.3);
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #00b4d8;
      box-shadow: 0 6px 16px rgba(0, 210, 211, 0.5);
      transform: translateY(-1px);
    }

    .nav-container {
      text-align: center;
    }
  </style>
</head>
<body>

<h2>Add User</h2>

<div class="form-container">
  <form th:action="@{/users/save}" th:object="${user}" method="post">

    <div class="form-group">
      <label>Name:</label>
      <input type="text" th:field="*{name}" placeholder="Enter Name" required/>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" th:field="*{email}" placeholder="Enter Email" required/>
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" th:field="*{password}" placeholder="Enter Password" required/>
    </div>

    <button type="submit">Save User</button>

  </form>
</div>

<div class="nav-container">
  <a class="back-link" th:href="@{/users}">Back to Users List</a>
</div>

</body>
</html>
