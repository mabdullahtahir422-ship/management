spring.application.name=portfolioapp

# Correct separate Railway variables so Spring Boot automatically formats the JDBC URL correctly
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Table Creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port (Railway)
server.port=${PORT:8080}